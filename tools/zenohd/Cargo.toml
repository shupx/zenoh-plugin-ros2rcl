# Build the supplied upstream zenohd using exactly the plugin's dependency lock.
[package]
name = "zenohd"
version = "1.10.1"
edition = "2021"
publish = false
build = "../../../zenoh/zenohd/build.rs"

[features]
default = ["zenoh/default"]

[[bin]]
name = "zenohd"
path = "../../../zenoh/zenohd/src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
git-version = "0.3.9"
json5 = "0.4"
lazy_static = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zenoh = { version = "=1.10.1", path = "../../../zenoh/zenoh", features = ["internal", "plugins", "runtime_plugins", "unstable"] }
zenoh-config = { version = "=1.10.1", path = "../../../zenoh/commons/zenoh-config" }
zenoh-util = { version = "=1.10.1", path = "../../../zenoh/commons/zenoh-util" }

[build-dependencies]
rustc_version = "0.4"
